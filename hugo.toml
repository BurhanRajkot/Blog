baseURL = "/"
languageCode = "en-us"
title = "Noitas"
theme = "PaperMod"
enableRobotsTXT = true
canonifyURLs = true

# Chart HTML is pulled in by the chart shortcode via readFile, not built as pages
ignoreFiles = ['/charts/[^/]+\.html$']

# How many posts per page (PaperMod uses this internally)
[pagination]
  pagerSize = 10

# What Hugo generates
[outputs]
  home    = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy= ["HTML", "RSS"]
  term    = ["HTML", "RSS"]
  page    = ["HTML"]

# Custom pretty URLs per section
[permalinks]
  programming = "/programming/:slug/"
  gamedev     = "/gamedev/:slug/"
  books       = "/books/:slug/"
  mylife      = "/mylife/:slug/"

# Sitemap for SEO
[sitemap]
  changefreq = "daily"
  priority   = 0.5
  filename   = "sitemap.xml"

# ------------ PaperMod Params ------------
[params]
  defaultTheme      = "auto"    # auto | dark | light
  siteDescription   = "Programming, game dev notes, things going on in my life, and books."
  showReadingTime   = true
  showShareButtons  = true      # you are using custom share partial
  showSearch        = true

  # Main sections that appear on home (recommended)
  mainSections      = ["programming", "gamedev", "books", "mylife"]

  # Nice UX bits
  ShowBreadCrumbs   = false   # section shows in the post meta instead
  ShowCodeCopyButtons = true
  disableThemeToggle  = false   # keep the theme switcher
  comments           = false    # set true if you later add Disqus/Utterances/etc.

  author = "Burhanuddin"
  since  = "2025"            # year the blog started; shown on the home page
  # Optional: small text under the title in browser tab (PaperMod label)
  images = ["images/profile.jpg"]   # default social-share image
  [params.label]
    text = "Noitas"

# Home page. The hero reads these; edit freely.
[params.profileMode]
  enabled      = true
  name         = "Burhanuddin"
  greeting     = "Hi, I'm Burhanuddin."
  tagline      = "I take things apart to see how they work, then write down what I found."
  subtitle     = "This is my digital diary: programming, game dev, the books I'm reading, and whatever else is going on in my life. Raw, unfiltered, and mine."
  imageUrl     = "images/profile.jpg"   # lives in assets/ so Hugo can resize it
  imageTitle   = "Burhanuddin at home, bookshelf behind him"
  caption      = "Self-portrait at my desk, bookshelf behind me."

  # "Now" list on the home page: what you're up to right now. Keep it current.
  [[params.profileMode.now]]
    label = "Tinkering"
    text  = "Ubuntu + XFCE running on a Samsung Tab A8"
  [[params.profileMode.now]]
    label = "Writing"
    text  = "This blog, since November 2025"

# Only these 3 social icons appear globally (profile/footer)
[[params.socialIcons]]
  name = "github"
  url  = "https://github.com/BurhanRajkot"

[[params.socialIcons]]
  name = "linkedin"
  url  = "https://www.linkedin.com/in/burhanuddin-rajkotwala-84722b326/"

[[params.socialIcons]]
  name = "email"
  url  = "mailto:burhanuddinrajkotwala11@gmail.com"

# ------------ Taxonomies ------------
[taxonomies]
  tag      = "tags"
  category = "categories"

# ------------ Menus ------------
[menu]

  [[menu.main]]
    name   = "Home"
    url    = "/"
    weight = 1

  [[menu.main]]
    name   = "Programming"
    url    = "/programming/"
    weight = 2

  [[menu.main]]
    name   = "Game Dev"
    url    = "/gamedev/"
    weight = 3

  [[menu.main]]
    name   = "Books"
    url    = "/books/"
    weight = 4

  [[menu.main]]
    name   = "My Life"
    url    = "/mylife/"
    weight = 5

  [[menu.main]]
    name   = "About"
    url    = "/about/"
    weight = 6

# ------------ Markup / Code Highlighting ------------
[markup]

  [markup.highlight]
    noClasses = false   # required for PaperMod's built-in code styling
    # style = "dracula" # you can pick a theme if you want, or leave to CSS

  # Optional: enable typographic smartness (quotes, dashes)
  [markup.goldmark.renderer]
    unsafe = true       # allows raw HTML in markdown (needed for some embeds)
