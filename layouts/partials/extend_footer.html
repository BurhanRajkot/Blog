{{- /* Reading bar (CSS scroll timeline), portrait toggle, Konami-code CRT mode */ -}}
{{- if .IsPage }}
<div class="read-progress" aria-hidden="true"></div>
{{- end }}
<div class="toast" role="status" aria-live="polite" hidden></div>
<script>
(function () {
  // Portrait: hover shows the real photo on desktop; tap toggles it on touch screens
  var portrait = document.querySelector('.portrait');
  if (portrait) {
    portrait.addEventListener('click', function () {
      var on = portrait.getAttribute('aria-pressed') !== 'true';
      portrait.setAttribute('aria-pressed', String(on));
      portrait.setAttribute('aria-label', on ? 'Show the pixel portrait' : 'Show the real photo');
    });
  }

  // Up Up Down Down Left Right Left Right B A toggles CRT mode
  var code = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
  var pos = 0;
  var toast = document.querySelector('.toast');
  var toastTimer;

  function say(text) {
    toast.textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; }, 2200);
  }

  document.addEventListener('keydown', function (e) {
    var key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    pos = key === code[pos] ? pos + 1 : (key === code[0] ? 1 : 0);
    if (pos < code.length) return;
    pos = 0;
    var on = document.documentElement.classList.toggle('crt');
    try { localStorage.setItem('crt', on ? '1' : '0'); } catch (err) {}
    say(on ? 'CRT mode on' : 'CRT mode off');
  });
})();
</script>
