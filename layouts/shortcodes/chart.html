{{- /* Embeds a pre-rendered Plotly chart. Usage: {{< chart "content/<path>/charts/x.html" "Optional caption" >}} */ -}}
{{- $path := .Get 0 -}}
{{- $content := readFile $path -}}
{{- with $content -}}
<figure class="chart">
  <div class="chart-body">{{ . | safeHTML }}</div>
  {{- with $.Get 1 }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
{{- else -}}
{{- errorf "Chart not found: %s" $path -}}
{{- end -}}
