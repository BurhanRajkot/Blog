<!DOCTYPE html>
<html lang="{{ site.Language }}">
<head>
  {{- partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}{{ with .Section }} sec-{{ . }}{{ end }}" id="top">
  <a class="skip" href="#content">Skip to content</a>
  {{- partial "header.html" . }}
  <main id="content" class="main">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}
</body>
</html>
