{{- define "main" }}
<header class="page-head wrap">
  <p class="eyebrow">Search</p>
  <h1 class="page-title">Find an entry</h1>
</header>
<div class="wrap">
  <div id="searchbox" class="searchbox">
    <input id="searchInput" autofocus placeholder="Type to search titles and text…" aria-label="Search" type="search" autocomplete="off" maxlength="64">
    <ul id="searchResults" aria-label="Search results"></ul>
  </div>
</div>
{{- end }}
